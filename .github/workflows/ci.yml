name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS / Python ${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check --output-format=github
      - name: Check formatting
        run: uv run ruff format --check
      - name: Type check
        run: uv run mypy
      # The BPF devices belong to root. Opening them to everyone on this
      # throwaway runner, much as Wireshark's ChmodBPF does for one group,
      # lets the loopback capture tests run instead of skipping.
      - name: Allow packet capture without root
        run: sudo chmod o+rw /dev/bpf*
      - name: Test
        run: uv run pytest
      - name: Smoke test the command line tool
        run: |
          uv run pilotfish --version
          uv run pilotfish interfaces

  # Parsers work on bytes and never touch the OS, so they run on Linux too.
  # This job installs no extras, which also proves the core installs without Qt.
  linux:
    name: Linux / parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run pytest -m "not macos"
