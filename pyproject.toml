[project]
name = "pilotfish"
version = "0.1.0"
description = "A packet capture and protocol analyzer for macOS, written from scratch in Python."
readme = "README.md"
requires-python = ">=3.12"
# The core uses only the standard library. Front ends and later features add
# their dependencies as extras, so the core and CLI install without Qt.
dependencies = []

[project.scripts]
pilotfish = "pilotfish.cli.main:main"

[project.optional-dependencies]
gui = [
    "pyside6>=6.11.2",
]
tls = [
    "cryptography>=50.0.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "PT", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"scapy".msg = "Decode packets yourself; scapy is allowed in tests only, as a second opinion."
"dpkt".msg = "Decode packets yourself; dpkt is allowed in tests only, as a second opinion."
"pyshark".msg = "Decode packets yourself; pyshark is allowed in tests only, as a second opinion."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "macos: needs macOS system facilities such as libpcap or /dev/bpf; the Linux CI job skips these",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
